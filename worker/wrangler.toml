name = "online-training"
main = "src/index.js"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "fwmc-training-codes"
database_id = "ccb90ea8-7d96-4779-bfb4-f93860905f81"

# Rate limit for the public code lookup (GET /program): 30 per minute per IP.
# Needs wrangler 4.36 or newer (npm install picks up the latest 4.x).
[[ratelimits]]
name = "LOOKUP_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 30
  period = 60

# Erinnerungen (2026-10-05): rate limit for POST/DELETE /reminders
# (20 per minute per IP - the app syncs a few times a day at most).
[[ratelimits]]
name = "REMINDER_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 20
  period = 60

# Cron: send due reminders every 5 minutes.
[triggers]
crons = ["*/5 * * * *"]

# VAPID public key for Web Push (from `node scripts/gen-vapid.mjs`). The same
# value goes into app.js as REMINDER_VAPID_PUBLIC_KEY. The private key is a
# secret: `npx wrangler secret put VAPID_PRIVATE_KEY` - never commit it.
[vars]
VAPID_PUBLIC_KEY = "BCes2a8Y5x41WmaHmfOzmzxoUXIbEr06-LoBNnz98w8tMw_OAWN8Ses5tYGZXDwD0UrzaYBzot7mGVGjXVX7C7k"
VAPID_SUBJECT = "https://fwmcoaching.github.io/fwmc-Training-app/"

# The admin token is set once via:
#   npx wrangler secret put ADMIN_TOKEN
# Never commit its value - only the binding name is declared here.
